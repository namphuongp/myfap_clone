services:
  mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "myfap-rs", "--bind_ip_all", "--port", "27018"]
    ports:
      - "127.0.0.1:27018:27018"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--port", "27018", "--eval", "try { rs.status() } catch (e) { rs.initiate({_id:'myfap-rs',members:[{_id:0,host:'127.0.0.1:27018'}]}) }; quit(db.hello().isWritablePrimary ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  mongo_data:
