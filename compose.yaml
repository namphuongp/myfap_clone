services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_DATABASE: myfap
      MYSQL_USER: myfap
      MYSQL_PASSWORD: ${DB_PASSWORD:-LocalDemo@123456}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RootLocalDemo@123456}
    volumes:
      - myfap_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  myfap_mysql:
